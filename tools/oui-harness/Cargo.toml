[package]
name = "oui-harness"
version = "0.1.0"
edition = "2024"
publish = false
description = "Renders .oui files with the opengpui core on Herdr's gpui-shell, offscreen."

# The runtime is the one Herdr embeds, not upstream gpui-kit: Herdr vendors
# gpui-kit 0.7.1 (crates base, fps, shell) and gpui-pre 0.3.8 with its own
# patches (marked HERDR:), and the core depends on some of them (on_size_change,
# spin, loop, InputState.focus). So every crate below comes from the herdr-app
# tag of the installed Herdr, with the same [patch] table herdr-app's own
# Cargo.toml has. A Herdr update moves HERDR_APP_VERSION in src/main.rs and
# every `tag` here together; the harness refuses to run while they differ.
[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8", features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "runtime_shaders", "test-support"] }
gpui-shell = { git = "https://github.com/herdrdev/herdr-app", tag = "v0.1.13" }
gpui-base = { git = "https://github.com/herdrdev/herdr-app", tag = "v0.1.13", features = ["test-support"] }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[patch.crates-io]
gpui-pre = { git = "https://github.com/herdrdev/herdr-app", tag = "v0.1.13" }
gpui-pre-wgpu = { git = "https://github.com/herdrdev/herdr-app", tag = "v0.1.13" }
gpui-pre-apple = { git = "https://github.com/herdrdev/herdr-app", tag = "v0.1.13" }
gpui-pre-macos = { git = "https://github.com/herdrdev/herdr-app", tag = "v0.1.13" }
gpui-pre-linux = { git = "https://github.com/herdrdev/herdr-app", tag = "v0.1.13" }
gpui-pre-windows = { git = "https://github.com/herdrdev/herdr-app", tag = "v0.1.13" }
zed-xim = { git = "https://github.com/herdrdev/herdr-app", tag = "v0.1.13" }
xim-ctext = { git = "https://github.com/herdrdev/herdr-app", tag = "v0.1.13" }
taffy = { git = "https://github.com/herdrdev/herdr-app", tag = "v0.1.13" }
rquickjs = { git = "https://github.com/herdrdev/herdr-app", tag = "v0.1.13" }

[patch."https://github.com/longbridge/quickjs-jit"]
quickjs-jit-runtime = { git = "https://github.com/herdrdev/herdr-app", tag = "v0.1.13" }

# As gpui-kit's own dev profile: without these, a debug build runs every
# script render roughly three times slower.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
taffy = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
resvg = { opt-level = 3 }
smol = { opt-level = 3 }
quickjs-jit = { opt-level = 3 }
quickjs-jit-runtime = { opt-level = 3 }
quickjs-jit-sys = { opt-level = 3 }
quickjs-jit-core = { opt-level = 3 }
cap-std = { opt-level = 3 }
