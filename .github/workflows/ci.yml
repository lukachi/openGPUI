name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      # The Herdr the mod is built and checked against (tools/harness/host/Cargo.toml pins the same).
      HERDR_VERSION: "0.1.13"
      HERDR_SHA256: 77b0be72a46ca14bb367365a04164641f914b3a69712bac391d39c56a959bef4
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # fontTools for the Inter cuts (scripts/sync.ts).
      - uses: astral-sh/setup-uv@v6

      # The oldest Node the CLI supports: the contract tests run it.
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      # herdr-app: `types` writes the gpui-kit/herdr declarations, `check` loads the mod.
      # It links the desktop libraries a window needs even when it opens none.
      - name: Herdr
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon-x11-0 libxkbcommon0 libxcb1 libx11-xcb1 libwayland-client0 libvulkan1 libfontconfig1 libfreetype6
          curl -fsSL "https://releases.herdr.dev/app/$HERDR_VERSION/herdr-app-linux-x86_64.tar.gz" -o "$RUNNER_TEMP/herdr.tgz"
          echo "$HERDR_SHA256  $RUNNER_TEMP/herdr.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/herdr.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/herdr-app" >> "$GITHUB_PATH"
          missing=$(ldd "$RUNNER_TEMP/herdr-app/herdr-app" | grep 'not found' || true)
          if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
          "$RUNNER_TEMP/herdr-app/herdr-app" --version

      - uses: actions/cache@v4
        with:
          path: .upstream
          key: upstream-${{ hashFiles('upstream.json', 'src/render/fonts.ts', 'scripts/sync.ts') }}

      - run: bun install --frozen-lockfile
      - run: bun run sync
      - run: bun run check
      - run: bun test
